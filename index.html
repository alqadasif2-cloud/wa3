<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TRUST WALLET PRO</title>
    <meta name="description" content="Professional crypto wallet app inspired by Trust Wallet with real-time balances, time-locked transactions, notifications, and owner administration." />
    <meta property="og:title" content="TRUST WALLET PRO" />
    <meta property="og:description" content="Professional crypto wallet app inspired by Trust Wallet with real-time balances, time-locked transactions, notifications, and owner administration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#070b13" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#070b13] text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-400">
    <div id="root">
      <div id="app-splash" style="position:fixed;inset:0;background:#070b13;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:#f8fafc;z-index:99999;">
        <div style="position:relative;margin-bottom:20px;">
          <img src="./trust-wallet-logo.png" alt="Trust Wallet Pro" style="width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 8px 30px rgba(0,82,255,0.45));" />
        </div>
        <div style="font-size:20px;font-weight:700;letter-spacing:1px;margin-bottom:8px;">TRUST WALLET PRO</div>
        <div id="app-loading-text" style="font-size:13px;color:#94a3b8;">جاري تحميل المحفظة...</div>
        <div id="app-diagnostic" style="display:none;margin-top:20px;padding:12px 18px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:14px;max-width:85%;font-size:12px;color:#fca5a5;text-align:center;">
          <div id="app-diagnostic-msg"></div>
          <button onclick="location.reload()" style="margin-top:10px;padding:6px 14px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">إعادة المحاولة</button>
        </div>
      </div>
    </div>
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          console.error('[Diagnostic] Window Error:', e.message, e.filename, e.lineno);
          var diag = document.getElementById('app-diagnostic');
          var msg = document.getElementById('app-diagnostic-msg');
          var text = document.getElementById('app-loading-text');
          if (diag && msg) {
            diag.style.display = 'block';
            if (text) text.innerText = 'تعذر تشغيل الواجهة';
            msg.innerText = e.message || 'حدث خطأ أثناء تحميل موارد التطبيق';
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          console.error('[Diagnostic] Unhandled Rejection:', e.reason);
        });
        setTimeout(function() {
          var root = document.getElementById('root');
          var splash = document.getElementById('app-splash');
          var diag = document.getElementById('app-diagnostic');
          var msg = document.getElementById('app-diagnostic-msg');
          if (splash && root && root.children.length === 1 && root.children[0] === splash) {
            if (diag && msg && diag.style.display !== 'block') {
              diag.style.display = 'block';
              msg.innerText = 'استغرق التحميل وقتاً طويلاً. اضغط أدناه لإعادة المحاولة.';
            }
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
