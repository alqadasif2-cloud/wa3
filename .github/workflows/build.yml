name: CI Build & Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure npm
        run: |
          npm config set legacy-peer-deps true
          echo "legacy-peer-deps=true" >> .npmrc

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trust-wallet-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  android-build:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: trust-wallet-web-dist
          path: dist

      - name: Embed Web Dist into Android Assets
        run: |
          mkdir -p app/src/main/assets/dist
          cp -rf dist/* app/src/main/assets/dist/ 2>/dev/null || true
          echo "Assets bundled into app/src/main/assets/dist:"
          ls -la app/src/main/assets/dist

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Android Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Artifact
        run: |
          mkdir -p release-apk
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-apk/trust-wallet-pro.apk
            echo "✅ Successfully copied APK: $APK_FILE -> release-apk/trust-wallet-pro.apk"
            ls -lh release-apk/trust-wallet-pro.apk
          else
            echo "❌ Error: Could not locate built APK under app/build/outputs/apk"
            find app/build -type f || true
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trust-wallet-pro-apk
          path: release-apk/trust-wallet-pro.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Summary
        run: |
          echo "### 🚀 Trust Wallet Pro Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The Android APK is compiled and ready for download:" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: \`trust-wallet-pro-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`trust-wallet-pro.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SDK Target**: Android 14 (API 34) / Min SDK 24" >> $GITHUB_STEP_SUMMARY
